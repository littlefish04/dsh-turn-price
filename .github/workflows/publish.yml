# 打 tag（v*）后自动发布到 npm，并生成 SLSA provenance；也可以手动 dispatch
# （Actions 页面 → publish → Run workflow）—— 手动跑等于做一次「配置体检」。
#
# 一次性准备（在 npmjs.com 上，不是在本文件里）：
#   Package → Settings → Trusted Publisher → GitHub Actions
#     Organization or user: littlefish04
#     Repository:           dsh-turn-price
#     Workflow filename:    publish.yml
#     Environment:          （留空）
#     Allowed actions:      Allow npm publish
#   配好之后本 workflow 不需要任何 NPM_TOKEN secret —— 它用 OIDC 换一次性凭据。
#   ⚠️ 这个关系**只能用网页配**：本机 `npm trust github` 会报 E403（带 Bypass 2FA 的
#   granular token 不允许做 trust / 账号类操作）。所以下面那步「自检」是唯一的自动化验收手段。
name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC：npm 可信发布与 provenance 都需要

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 不要加 registry-url：setup-node 会写出一个带空 _authToken 的 .npmrc，
      # 反而会挡住 npm 走 OIDC。保持没有 .npmrc，npm 默认就用 registry.npmjs.org。
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 用 GitHub 的 OIDC 身份直接向 registry 换一次发布凭据 —— 不发布任何东西，
      # 只回答一个问题：npmjs.com 上的 Trusted Publisher 到底配对没有。
      # 接口与 npm CLI 内部用的是同一个（见 npm/lib/utils/oidc.js）：
      #   POST {registry}/-/npm/v1/oidc/token/exchange/package/<包名>
      #   Authorization: Bearer <GitHub 签发的 id_token，audience = npm:registry.npmjs.org>
      # 手动 dispatch 时失败直接判红（这就是「配置验收」）；tag 推送时只警告，不挡发布。
      - name: 自检 OIDC 可信发布（不发布任何东西）
        run: |
          set -euo pipefail
          id_token="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.value){console.error("GitHub 未返回 id_token:",s);process.exit(1)}process.stdout.write(j.value)})')"
          export id_token
          response="$(curl -sS -X POST -H "Authorization: Bearer ${id_token}" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/dsh-turn-price")"
          export response
          # 成功的回应长这样（token 会被 GitHub 自动打码）：
          #   {"created":...,"expires":...,"token":"***","token_type":"oidc"}
          # 判据只看「有没有换到非空的 token」——不要假设前缀（npm 没说一定是 npm_ 开头）。
          ok="$(node -e 'const j=JSON.parse(process.env.response||"{}");process.stdout.write(typeof j.token==="string"&&j.token.length>0?"yes":"no")' 2>/dev/null || echo no)"
          safe="$(node -e 'process.stdout.write((process.env.response||"").replace(/"token"\s*:\s*"[^"]*"/,"\"token\":\"<hidden>\""))' 2>/dev/null || echo '<无法解析的回应>')"
          if [ "$ok" = "yes" ]; then
            echo "::notice::OIDC 可信发布自检通过 —— registry 用本工作流的身份换到了一次性发布凭据（回应：${safe}）。没发布任何东西，凭据已丢弃。"
          else
            echo "::error::OIDC 可信发布自检失败，registry 的回应是 ${safe}"
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              exit 1
            fi
            echo "::warning::tag 推送不做硬失败（真正的发布步骤会自己报错）；请去 npmjs.com → 该包 → Settings → Trusted Publisher 核对配置。"
          fi

      - name: 升级到支持可信发布的 npm
        run: npm install -g npm@latest

      - name: 语法自检
        run: npm run check

      # 版本号是新的 → 正常走 OIDC 可信发布（带 provenance）。
      # 版本号已存在（例如回头给本机发过的版本补 tag）→ 跳过，流水线保持绿色。
      # ⚠️ 这里命中「已存在」**不能**证明可信发布是通的 —— npm 客户端自己就会在本地判重
      # （EPUBLISHCONFLICT / cannot publish over the previously published versions），
      # 压根不必碰 registry。要验收配置，看上面那步「自检」。
      - name: 发布（版本已存在时视为成功）
        run: |
          if output="$(npm publish --provenance --access public 2>&1)"; then
            printf '%s\n' "$output"
            echo "::notice::发布成功（OIDC 可信发布 + provenance）。"
            exit 0
          fi
          printf '%s\n' "$output"
          if printf '%s' "$output" | grep -qE 'previously published version|EPUBLISHCONFLICT|E409'; then
            echo "::notice::该版本已经在 npm 上（registry 或 npm 客户端判重），跳过发布。"
            exit 0
          fi
          echo "::error::发布失败，且不是「版本已存在」——请看上面的 npm 输出。"
          exit 1
