# 打 tag（v0.1.0）后自动发布到 npm，并生成 SLSA provenance。
#
# 一次性准备（在 npmjs.com 上，不是在本文件里）：
#   Package → Settings → Trusted Publisher → GitHub Actions
#     Organization or user: littlefish04
#     Repository:           dsh-turn-price
#     Workflow filename:    publish.yml
#     Environment:          （留空）
#   配好之后本 workflow 不需要任何 NPM_TOKEN secret —— 它用 OIDC 换一次性凭据。
#
# 还没配好 Trusted Publisher 之前，请不要推 v* tag：本 workflow 会失败。
# 首次发布建议先按 PUBLISHING.md 在本机 `npm publish`。
name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC：npm 可信发布与 provenance 都需要

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 不要加 registry-url：setup-node 会写出一个带空 _authToken 的 .npmrc，
      # 反而会挡住 npm 走 OIDC。保持没有 .npmrc，npm 默认就用 registry.npmjs.org。
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 升级到支持可信发布的 npm
        run: npm install -g npm@latest

      - name: 语法自检
        run: npm run check

      # 一次调用同时干两件事：
      #   1) 版本号是新的 → 正常用 OIDC 可信发布（带 provenance）；
      #   2) 版本号已存在（例如回头给本机发过的版本补 tag）→ registry 回 409，
      #      这里视为「本来就不用发」而退出 0，流水线保持绿色。
      # ⚠️ 顺带的好处：**能走到 409 就证明可信发布关系是通的** —— npm 必须先拿本工作流的
      # OIDC 身份向 registry 换到一次性发布凭据，才会走到 PUT 这一步；没配好 Trusted Publisher
      # 时根本到不了这里（报的是 Access token expired / E404）。所以这条日志就是配置的自检。
      - name: 发布（版本已存在时视为成功 —— 顺便自检可信发布关系）
        run: |
          if output="$(npm publish --provenance --access public 2>&1)"; then
            printf '%s\n' "$output"
            echo "::notice::发布成功（OIDC 可信发布）。"
            exit 0
          fi
          printf '%s\n' "$output"
          if printf '%s' "$output" | grep -qE 'previously published version|EPUBLISHCONFLICT|E409'; then
            echo "::notice::该版本已经在 npm 上（registry 回了 409），跳过发布。能走到这一步即说明 OIDC 可信发布已打通。"
            exit 0
          fi
          echo "::error::发布失败，且不是「版本已存在」——请看上面的 npm 输出。"
          exit 1
