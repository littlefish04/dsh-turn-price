# 打 tag（v0.1.0）后自动发布到 npm，并生成 SLSA provenance。
#
# 一次性准备（在 npmjs.com 上，不是在本文件里）：
#   Package → Settings → Trusted Publisher → GitHub Actions
#     Organization or user: littlefish04
#     Repository:           dsh-turn-price
#     Workflow filename:    publish.yml
#     Environment:          （留空）
#   配好之后本 workflow 不需要任何 NPM_TOKEN secret —— 它用 OIDC 换一次性凭据。
#
# 还没配好 Trusted Publisher 之前，请不要推 v* tag：本 workflow 会失败。
# 首次发布建议先按 PUBLISHING.md 在本机 `npm publish`。
name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC：npm 可信发布与 provenance 都需要

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 不要加 registry-url：setup-node 会写出一个带空 _authToken 的 .npmrc，
      # 反而会挡住 npm 走 OIDC。保持没有 .npmrc，npm 默认就用 registry.npmjs.org。
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 升级到支持可信发布的 npm
        run: npm install -g npm@latest

      - name: 语法自检
        run: npm run check

      - name: 发布
        run: npm publish --provenance --access public
